<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #ff4757;
      color: white;
      text-align: center;
      padding: 50px 20px;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .box {
      background: white;
      color: #333;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.3);
      max-width: 350px;
      width: 100%;
    }
    h1 {
      color: #ff4757;
      font-size: 24px;
      margin-top: 0;
    }
    p {
      font-size: 16px;
      line-height: 1.5;
    }
    button {
      background-color: #2ed573;
      color: white;
      border: none;
      padding: 12px 25px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 20px;
      font-weight: bold;
    }
    button:active {
      background-color: #26af5f;
    }
    h1.dupa {
      font-size: xx-large;
      color: blueviolet;
      font-weight: bold;
      position: absolute;
      z-index: 999;
    }
  </style>
  <body>
    <div class="box">
      <h1>⚠️ UWAGA!</h1>
      <p>Wykryto, że Twój telefon właśnie stracił poczucie humoru.</p>
      <p>Aby naprawić urządzenie, musisz natychmiast postawić komuś kawę! ☕</p>
      <button id="btn">Kliknij, aby naprawić</button>
    </div>

    <h1 class="dupa">!!! ZOSTALES ZAPAPIEZOWANY !!!</h1>
  </body>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Funkcja tworząca pojedynczy div w losowym miejscu
      function createRandomDiv() {
        const randomDiv = document.createElement("div");

        // Wymiary elementu
        const divWidth = 100;
        const divHeight = 100;

        // Stylizacja
        randomDiv.style.width = `${divWidth}px`;
        randomDiv.style.height = `${divHeight}px`;
        randomDiv.style.position = "absolute";

        // Losowy kolor (dla lepszego efektu wizualnego)
        // const randomColor = `#${Math.floor(Math.random() * 16777215)
        //   .toString(16)
        //   .padStart(6, "0")}`;
        // randomDiv.style.backgroundColor = randomColor;
        randomDiv.style.backgroundImage = "url('papaj.jpg')";
        randomDiv.style.backgroundSize = "cover";
        randomDiv.style.backgroundPosition = "center";
        randomDiv.style.backgroundRepeat = "no-repeat";
        randomDiv.style.borderRadius = "6px";

        // Obliczanie granic
        const maxX = window.innerWidth - divWidth;
        const maxY = document.documentElement.scrollHeight - divHeight;

        // Losowa pozycja
        const randomX = Math.floor(Math.random() * Math.max(0, maxX));
        const randomY = Math.floor(Math.random() * Math.max(0, maxY));

        randomDiv.style.left = `${randomX}px`;
        randomDiv.style.top = `${randomY}px`;

        // Dodanie do strony
        document.body.appendChild(randomDiv);
      }

      // Wywołanie funkcji co 500 milisekund (0.5s)
      setInterval(createRandomDiv, 100);
    });
  </script>
</html>
